---
apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  name: monitoring
spec:
  replicas: 3
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-service
spec:
  ports:
  - name: web
    port: 9093
    protocol: TCP
    targetPort: web
  selector:
    alertmanager: monitoring
