---
apiVersion: v1
kind: ConfigMap
metadata:
  name:      loki-config
  namespace: monitoring
  labels:
    app.kubernetes.io/component: loki
    app.kubernetes.io/name:      loki
    app.kubernetes.io/part-of:   kube-prometheus
    app.kubernetes.io/version:   3.5.0
data:
  config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      log_level: warn

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory:  /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled:     true
            max_size_mb: 100

    schema_config:
      configs:
      - from:         "2025-01-01"
        store:        tsdb
        object_store: filesystem
        schema:       v13
        index:
          prefix: index_
          period: 24h

    limits_config:
      retention_period: 744h

    compactor:
      retention_enabled:    true
      delete_request_store: filesystem
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name:      loki
  namespace: monitoring
  labels:
    app.kubernetes.io/component: loki
    app.kubernetes.io/name:      loki
    app.kubernetes.io/part-of:   kube-prometheus
    app.kubernetes.io/version:   3.5.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: loki
      app.kubernetes.io/name:      loki
      app.kubernetes.io/part-of:   kube-prometheus
  serviceName: loki-headless
  template:
    metadata:
      labels:
        app.kubernetes.io/component: loki
        app.kubernetes.io/name:      loki
        app.kubernetes.io/part-of:   kube-prometheus
        app.kubernetes.io/version:   3.5.0
    spec:
      securityContext:
        fsGroup:      10001
        runAsGroup:   10001
        runAsNonRoot: true
        runAsUser:    10001
      containers:
      - name:  loki
        image: docker.io/grafana/loki:3.5.0
        args:
        - -config.file=/etc/loki/config.yaml
        ports:
        - containerPort: 3100
          name:          http
        - containerPort: 9095
          name:          grpc
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 15
        resources:
          limits:
            cpu:    200m
            memory: 256Mi
          requests:
            cpu:    100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name:      config
          mountPath: /etc/loki
          readOnly:  true
        - name:      data
          mountPath: /loki
        - name:      tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: loki-config
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: longhorn
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name:      loki
  namespace: monitoring
  labels:
    app.kubernetes.io/component: loki
    app.kubernetes.io/name:      loki
    app.kubernetes.io/part-of:   kube-prometheus
    app.kubernetes.io/version:   3.5.0
spec:
  ports:
  - name:       http
    port:       3100
    targetPort: http
  - name:       grpc
    port:       9095
    targetPort: grpc
  selector:
    app.kubernetes.io/component: loki
    app.kubernetes.io/name:      loki
    app.kubernetes.io/part-of:   kube-prometheus
---
apiVersion: v1
kind: Service
metadata:
  name:      loki-headless
  namespace: monitoring
  labels:
    app.kubernetes.io/component: loki
    app.kubernetes.io/name:      loki
    app.kubernetes.io/part-of:   kube-prometheus
    app.kubernetes.io/version:   3.5.0
spec:
  clusterIP: None
  ports:
  - name:       http
    port:       3100
    targetPort: http
  selector:
    app.kubernetes.io/component: loki
    app.kubernetes.io/name:      loki
    app.kubernetes.io/part-of:   kube-prometheus
