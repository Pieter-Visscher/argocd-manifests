---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-ollama
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: mcp-ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
      app.kubernetes.io/part-of: mcp-ollama
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/part-of: mcp-ollama
    spec:
      containers:
      - name: ollama
        image: docker.io/ollama/ollama:latest
        command:
          - /bin/sh
          - -c
          - |
            ollama serve &
            until ollama list > /dev/null 2>&1; do sleep 1; done
            ollama list | grep -q bge-m3 || ollama pull bge-m3
            wait
        ports:
        - containerPort: 11434
        readinessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 30
          periodSeconds: 15
        volumeMounts:
        - name: models
          mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: mcp-ollama-pvc-models
