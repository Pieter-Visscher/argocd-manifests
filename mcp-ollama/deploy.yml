---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mcp-ollama
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: mcp-ollama
spec:
  serviceName: mcp-ollama-svc
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
      app.kubernetes.io/part-of: mcp-ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/part-of: mcp-ollama
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: ollama
                topologyKey: kubernetes.io/hostname
      containers:
      - name: ollama
        image: docker.io/ollama/ollama:latest
        command:
          - /bin/sh
          - -c
          - |
            ollama serve &
            until ollama list > /dev/null 2>&1; do sleep 1; done
            ollama list | grep -q bge-m3 || ollama pull bge-m3
            ollama list | grep -q llama3.2 || ollama pull llama3.2
            wait
        ports:
        - containerPort: 11434
        readinessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 30
          periodSeconds: 15
        volumeMounts:
        - name: models
          mountPath: /root/.ollama
  volumeClaimTemplates:
  - metadata:
      name: models
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      storageClassName: longhorn
