---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: coolify
  labels:
    app: coolify
spec:
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/domain: coolify
    spec:
      domain:
        features:
          hyperv:
            relaxed: { enabled: true }
            vapic: { enabled: true }
            spinlocks: { enabled: true }
          acpi: {}
        firmware:
          bootloader:
            efi:
              secureBoot: false
        cpu:
          cores: 2
        devices:
          disks:
            - name: bootdisk
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            - name: default
              bridge: {}
        resources:
          requests:
            memory: 8Gi
      networks:
        - name: default
          multus:
            networkName: services-vlan
      volumes:
        - name: bootdisk
          dataVolume:
            name: ubuntu-disk-image
        - name: cloudinit
          cloudInitNoCloud:
            userData: |
              #cloud-config
              users:
                - name: pieter
                  groups: sudo
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  shell: /bin/bash
                  lock_passwd: false
                  ssh_authorized_keys:
                    - ssh-rsa  pieter@Pieters-MacBook-Pro.local
              chpasswd:
                expire: false
                users:
                  - name: pieter
                    password: test123
                    type: text
              ssh_pwauth: true
              write_files:
                - path: /etc/docker/daemon.json
                  content: |
                    {
                      "default-address-pools": [
                        { "base": "172.16.0.0/12", "size": 24 }
                      ]
                    }
                - path: /etc/netplan/99-static.yaml
                  permissions: '0600'
                  content: |
                    network:
                      version: 2
                      ethernets:
                        enp1s0:
                          dhcp4: false
                          addresses:
                            - 10.0.200.100/24
                          routes:
                            - to: default
                              via: 10.0.200.1
                          nameservers:
                            addresses:
                              - 10.0.200.1
                            search: []
              runcmd:
                - netplan apply
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: ubuntu-disk-image
spec:
  source:
    http:
      url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
  pvc:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 50Gi
