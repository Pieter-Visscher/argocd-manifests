---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-registry-config
data:
  config.json: |
    {
      "distSpecVersion": "1.1.0",
      "storage": {
        "rootDirectory": "/var/lib/registry"
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "externalUrl": "https://registry.nauvis.lan"
      },
      "log": {
        "level": "info"
      },
      "extensions": {
        "sync": {
          "enable": true,
          "registries": [
            {
              "urls": ["https://registry.ollama.ai"],
              "onDemand": true,
              "content": [
                {
                  "prefix": "library/bge-m3"
                }
              ]
            }
          ]
        }
      }
    }
