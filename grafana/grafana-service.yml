---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: kube-prometheus
    app.kubernetes.io/version: 12.4.0
  name: grafana
  namespace: monitoring
spec:
  ports:
  - name: http
    port: 3000
    targetPort: http
  selector:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: kube-prometheus
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-https-route
spec:
  parentRefs:
  # group/kind are defaulted by the Gateway API admission controller; write
  # them out so ArgoCD doesn't see the defaulted live fields as drift.
  - group:       gateway.networking.k8s.io
    kind:        Gateway
    name:        homelab-gateway
    namespace:   gateway
    sectionName: https
  hostnames:
  - "grafana.nauvis.lan"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group:  ""
      kind:   Service
      name:   grafana
      port:   3000
      weight: 1


