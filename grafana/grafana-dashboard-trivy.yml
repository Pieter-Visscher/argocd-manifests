---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/name:      grafana
    app.kubernetes.io/part-of:   kube-prometheus
    app.kubernetes.io/version:   12.4.0
  name:      grafana-dashboard-trivy
  namespace: monitoring
data:
  trivy.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["trivy", "security"],
      "time": { "from": "now-1h", "to": "now" },
      "timezone": "browser",
      "title": "Trivy — Cluster Findings",
      "uid": "trivy-operator",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "hide": 0,
            "current": { "text": "Prometheus", "value": "Prometheus" }
          },
          {
            "name": "namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "query": "label_values(trivy_image_vulnerabilities, exported_namespace)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Vulnerabilities — Critical",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{
            "expr": "sum(\n  trivy_image_vulnerabilities{severity=\"Critical\", exported_namespace=~\"$namespace\", resource_kind=\"ReplicaSet\"}\n  * on(resource_name, exported_namespace) group_left()\n  (kube_replicaset_spec_replicas > 0)\n) or sum(trivy_image_vulnerabilities{severity=\"Critical\", exported_namespace=~\"$namespace\", resource_kind!=\"ReplicaSet\"})",
            "refId": "A"
          }],
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "red", "value": 1 }
              ]},
              "color": { "mode": "thresholds" }
            }
          },
          "options": { "colorMode": "background", "graphMode": "none" }
        },
        {
          "type": "stat",
          "title": "Vulnerabilities — High",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{
            "expr": "sum(\n  trivy_image_vulnerabilities{severity=\"High\", exported_namespace=~\"$namespace\", resource_kind=\"ReplicaSet\"}\n  * on(resource_name, exported_namespace) group_left()\n  (kube_replicaset_spec_replicas > 0)\n) or sum(trivy_image_vulnerabilities{severity=\"High\", exported_namespace=~\"$namespace\", resource_kind!=\"ReplicaSet\"})",
            "refId": "A"
          }],
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "orange", "value": 1 }
              ]},
              "color": { "mode": "thresholds" }
            }
          },
          "options": { "colorMode": "background", "graphMode": "none" }
        },
        {
          "type": "stat",
          "title": "Config Audit failures",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{
            "expr": "sum(trivy_resource_configaudits{severity=~\"Critical|High\", exported_namespace=~\"$namespace\"})",
            "refId": "A"
          }],
          "options": { "colorMode": "background", "graphMode": "none" }
        },
        {
          "type": "stat",
          "title": "Exposed secrets",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{
            "expr": "sum(trivy_image_exposedsecrets{exported_namespace=~\"$namespace\"})",
            "refId": "A"
          }],
          "options": { "colorMode": "background", "graphMode": "none" }
        },
        {
          "type": "timeseries",
          "title": "Vulnerability trend over time",
          "gridPos": { "x": 0, "y": 4, "w": 24, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(\n  trivy_image_vulnerabilities{severity=\"Critical\", exported_namespace=~\"$namespace\", resource_kind=\"ReplicaSet\"}\n  * on(resource_name, exported_namespace) group_left()\n  (kube_replicaset_spec_replicas > 0)\n) or sum(trivy_image_vulnerabilities{severity=\"Critical\", exported_namespace=~\"$namespace\", resource_kind!=\"ReplicaSet\"})",
              "legendFormat": "Critical",
              "refId": "A"
            },
            {
              "expr": "sum(\n  trivy_image_vulnerabilities{severity=\"High\", exported_namespace=~\"$namespace\", resource_kind=\"ReplicaSet\"}\n  * on(resource_name, exported_namespace) group_left()\n  (kube_replicaset_spec_replicas > 0)\n) or sum(trivy_image_vulnerabilities{severity=\"High\", exported_namespace=~\"$namespace\", resource_kind!=\"ReplicaSet\"})",
              "legendFormat": "High",
              "refId": "B"
            },
            {
              "expr": "sum(\n  trivy_image_vulnerabilities{severity=\"Medium\", exported_namespace=~\"$namespace\", resource_kind=\"ReplicaSet\"}\n  * on(resource_name, exported_namespace) group_left()\n  (kube_replicaset_spec_replicas > 0)\n) or sum(trivy_image_vulnerabilities{severity=\"Medium\", exported_namespace=~\"$namespace\", resource_kind!=\"ReplicaSet\"})",
              "legendFormat": "Medium",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": { "custom": { "lineWidth": 2, "fillOpacity": 10 } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "Critical" }, "properties": [{ "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "High" },     "properties": [{ "id": "color", "value": { "fixedColor": "orange", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "Medium" },   "properties": [{ "id": "color", "value": { "fixedColor": "yellow", "mode": "fixed" } }] }
            ]
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "type": "bargauge",
          "title": "Vulnerabilities by severity",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{
            "expr": "sum by (severity) (\n  trivy_image_vulnerabilities{severity=~\"Critical|High|Medium\", exported_namespace=~\"$namespace\", resource_kind=\"ReplicaSet\"}\n  * on(resource_name, exported_namespace) group_left()\n  (kube_replicaset_spec_replicas > 0)\n) or sum by (severity) (trivy_image_vulnerabilities{severity=~\"Critical|High|Medium\", exported_namespace=~\"$namespace\", resource_kind!=\"ReplicaSet\"})",
            "legendFormat": "{{severity}}",
            "refId": "A"
          }],
          "options": { "orientation": "horizontal", "displayMode": "gradient" }
        },
        {
          "type": "table",
          "title": "Top vulnerable images (Critical + High)",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{
            "expr": "topk(20, sum by (image_repository, image_tag, exported_namespace) (\n  trivy_image_vulnerabilities{severity=~\"Critical|High\", exported_namespace=~\"$namespace\", resource_kind=\"ReplicaSet\"}\n  * on(resource_name, exported_namespace) group_left()\n  (kube_replicaset_spec_replicas > 0)\n) or sum by (image_repository, image_tag, exported_namespace) (trivy_image_vulnerabilities{severity=~\"Critical|High\", exported_namespace=~\"$namespace\", resource_kind!=\"ReplicaSet\"}))",
            "instant": true,
            "format": "table",
            "refId": "A"
          }],
          "transformations": [
            { "id": "organize", "options": {
              "excludeByName": { "Time": true, "__name__": true },
              "renameByName": { "Value": "vulnerabilities" }
            }}
          ]
        },
        {
          "type": "table",
          "title": "Vulnerabilities by namespace",
          "gridPos": { "x": 0, "y": 20, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{
            "expr": "sum by (exported_namespace, severity) (\n  trivy_image_vulnerabilities{exported_namespace=~\"$namespace\", resource_kind=\"ReplicaSet\"}\n  * on(resource_name, exported_namespace) group_left()\n  (kube_replicaset_spec_replicas > 0)\n) or sum by (exported_namespace, severity) (trivy_image_vulnerabilities{exported_namespace=~\"$namespace\", resource_kind!=\"ReplicaSet\"})",
            "instant": true,
            "format": "table",
            "refId": "A"
          }],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true } } },
            { "id": "groupingToMatrix", "options": {
              "columnField": "severity",
              "rowField": "exported_namespace",
              "valueField": "Value"
            }}
          ]
        },
        {
          "type": "table",
          "title": "Config audit findings by namespace",
          "gridPos": { "x": 12, "y": 20, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{
            "expr": "sum by (exported_namespace, severity) (trivy_resource_configaudits{exported_namespace=~\"$namespace\"})",
            "instant": true,
            "format": "table",
            "refId": "A"
          }],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true } } },
            { "id": "groupingToMatrix", "options": {
              "columnField": "severity",
              "rowField": "exported_namespace",
              "valueField": "Value"
            }}
          ]
        }
      ]
    }
