---
apiVersion: v1
kind: Namespace
metadata:
  name: trivy-system
  labels:
    name: trivy-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name:      trivy-operator
  namespace: trivy-system
  labels:
    app.kubernetes.io/name:    trivy-operator
    app.kubernetes.io/part-of: trivy-operator
    app.kubernetes.io/version: 0.23.0
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trivy-operator
  labels:
    app.kubernetes.io/name:    trivy-operator
    app.kubernetes.io/part-of: trivy-operator
    app.kubernetes.io/version: 0.23.0
rules:
- apiGroups: [""]
  resources:
  - nodes
  - namespaces
  - pods
  - pods/log
  - replicationcontrollers
  - services
  - serviceaccounts
  - resourcequotas
  - limitranges
  - configmaps
  - persistentvolumeclaims
  - persistentvolumes
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources:
  - deployments
  - statefulsets
  - daemonsets
  - replicasets
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources:
  - jobs
  - cronjobs
  verbs: ["get", "list", "watch"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources:
  - roles
  - rolebindings
  - clusterroles
  - clusterrolebindings
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources:
  - ingresses
  - networkpolicies
  verbs: ["get", "list", "watch"]
- apiGroups: ["policy"]
  resources:
  - podsecuritypolicies
  - poddisruptionbudgets
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "delete"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create"]
- apiGroups: ["aquasecurity.github.io"]
  resources:
  - vulnerabilityreports
  - clustervulnerabilityreports
  - configauditreports
  - clusterconfigauditreports
  - exposedsecretreports
  - rbacassessmentreports
  - clusterrbacassessmentreports
  - infraassessmentreports
  - clusterinfraassessmentreports
  - sbomreports
  - clustersbomreports
  - clustercompliancereports
  verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trivy-operator
  labels:
    app.kubernetes.io/name:    trivy-operator
    app.kubernetes.io/part-of: trivy-operator
    app.kubernetes.io/version: 0.23.0
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind:      ClusterRole
  name:      trivy-operator
subjects:
- kind:      ServiceAccount
  name:      trivy-operator
  namespace: trivy-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name:      trivy-operator
  namespace: trivy-system
  labels:
    app.kubernetes.io/name:    trivy-operator
    app.kubernetes.io/part-of: trivy-operator
    app.kubernetes.io/version: 0.23.0
data:
  OPERATOR_NAMESPACE:                   trivy-system
  OPERATOR_TARGET_NAMESPACES:           ""
  OPERATOR_LOG_DEV_MODE:                "false"
  OPERATOR_SCAN_JOB_TIMEOUT:            5m
  OPERATOR_CONCURRENT_SCAN_JOBS_LIMIT:  "3"
  OPERATOR_SCAN_JOB_RETRY_AFTER:        30s
  OPERATOR_METRICS_BIND_ADDRESS:        ":8080"
  OPERATOR_HEALTH_PROBE_BIND_ADDRESS:   ":9090"
  OPERATOR_VULNERABILITY_SCANNER_ENABLED:     "true"
  OPERATOR_CONFIG_AUDIT_SCANNER_ENABLED:      "true"
  OPERATOR_RBAC_ASSESSMENT_SCANNER_ENABLED:   "true"
  OPERATOR_INFRA_ASSESSMENT_SCANNER_ENABLED:  "true"
  OPERATOR_EXPOSED_SECRET_SCANNER_ENABLED:    "true"
  OPERATOR_SBOM_GENERATION_ENABLED:           "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name:      trivy-operator-trivy-config
  namespace: trivy-system
  labels:
    app.kubernetes.io/name:    trivy-operator
    app.kubernetes.io/part-of: trivy-operator
    app.kubernetes.io/version: 0.23.0
data:
  TRIVY_SEVERITY:          CRITICAL,HIGH,MEDIUM
  TRIVY_MODE:              Standalone
  TRIVY_TIMEOUT:           5m0s
  TRIVY_DB_REPOSITORY:     ghcr.io/aquasecurity/trivy-db:2
  TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db
  # Skip TLS verification for the homelab registry (self-signed CA)
  TRIVY_INSECURE_REGISTRIES.registry.nauvis.lan: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name:      trivy-operator-config
  namespace: trivy-system
  labels:
    app.kubernetes.io/name:    trivy-operator
    app.kubernetes.io/part-of: trivy-operator
    app.kubernetes.io/version: 0.23.0
data:
  vulnerabilityReports.scanner: Trivy
  configAuditReports.scanner:   Trivy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name:      trivy-operator
  namespace: trivy-system
  labels:
    app.kubernetes.io/name:    trivy-operator
    app.kubernetes.io/part-of: trivy-operator
    app.kubernetes.io/version: 0.23.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name:    trivy-operator
      app.kubernetes.io/part-of: trivy-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name:    trivy-operator
        app.kubernetes.io/part-of: trivy-operator
        app.kubernetes.io/version: 0.23.0
    spec:
      serviceAccountName: trivy-operator
      securityContext:
        runAsNonRoot: true
        runAsUser:    65534
        runAsGroup:   65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name:  trivy-operator
        image: ghcr.io/aquasecurity/trivy-operator:0.23.0
        envFrom:
        - configMapRef:
            name: trivy-operator
        - configMapRef:
            name: trivy-operator-trivy-config
        ports:
        - containerPort: 8080
          name:          metrics
        - containerPort: 9090
          name:          probes
        readinessProbe:
          httpGet:
            path: /readyz
            port: probes
        livenessProbe:
          httpGet:
            path: /healthz
            port: probes
        resources:
          limits:
            cpu:    500m
            memory: 256Mi
          requests:
            cpu:    100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name:      trivy-operator
  namespace: trivy-system
  labels:
    app.kubernetes.io/name:    trivy-operator
    app.kubernetes.io/part-of: trivy-operator
    app.kubernetes.io/version: 0.23.0
spec:
  ports:
  - name:       metrics
    port:       8080
    targetPort: metrics
  selector:
    app.kubernetes.io/name:    trivy-operator
    app.kubernetes.io/part-of: trivy-operator
