# Source: qdrant/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: qdrant
  labels:
    app: qdrant
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/instance: qdrant
    app.kubernetes.io/version: "v1.18.2"

data:
  initialize.sh: |
    #!/bin/sh
    echo "Soft limits"
    ulimit -a -S
    echo "Hard limits"
    ulimit -a -H
    ulimit -n $(ulimit -Hn)
    exec ./entrypoint.sh
    # HA: uncomment for clustered bootstrap
    # SET_INDEX=${HOSTNAME##*-}
    # echo "Starting initializing for pod $SET_INDEX"
    # if [ "$SET_INDEX" = "0" ]; then
    #   exec ./entrypoint.sh --uri 'http://qdrant-0.qdrant-headless:6335'
    # else
    #   exec ./entrypoint.sh --bootstrap 'http://qdrant-0.qdrant-headless:6335' --uri 'http://qdrant-'"$SET_INDEX"'.qdrant-headless:6335'
    # fi
    
  production.yaml: |
    service:
      enable_tls: false
