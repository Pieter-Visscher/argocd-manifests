apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://git@git.pieter.fish/pieter/argocd-manifests.git
    targetRevision: HEAD
    path: grafana/
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Large dashboard ConfigMaps (e.g. node-exporter-full ~537KB) blow past
      # the 262144-byte last-applied-configuration annotation limit under
      # client-side apply. Use server-side apply, which stores managed fields
      # instead of a whole-object annotation.
      - ServerSideApply=true
