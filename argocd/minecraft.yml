apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minecraft
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://git@git.pieter.fish/pieter/argocd-manifests.git
    targetRevision: HEAD
    path: minecraft/
    directory:
      recurse: true
  destination:
    namespace: minecraft
    server: https://kubernetes.default.svc
  syncPolicy:
    managedNamespaceMetadata:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
