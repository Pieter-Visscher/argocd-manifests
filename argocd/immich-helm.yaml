apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich-helm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/immich-app/immich-charts
    chart: immich
    targetRevision: 0.10.3
    helm:
      valuesObject:
        controllers:
          main:
            containers:
              main:
                image:
                  tag: v2.7.5
        server:
          controllers:
            main:
              containers:
                main:
                  env:
                    DB_HOSTNAME:
                      valueFrom:
                        secretKeyRef:
                          name: immich-database-app
                          key: host
                    DB_USERNAME:
                      valueFrom:
                        secretKeyRef:
                          name: immich-database-app
                          key: user
                    DB_PASSWORD:
                      valueFrom:
                        secretKeyRef:
                          name: immich-database-app
                          key: password
                    DB_DATABASE_NAME:
                      valueFrom:
                        secretKeyRef:
                          name: immich-database-app
                          key: dbname
        valkey:
          enabled: true
        immich:
          metrics:
            enabled: "true"
          persistence:
            library:
              existingClaim: immich-library-pvc
  destination:
    namespace: immich
    server: https://kubernetes.default.svc
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        gateway-access: "true"
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
