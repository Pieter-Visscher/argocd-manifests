---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: uboulder-01
  labels:
    app: uboulder-01
spec:
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/domain: uboulder-01
    spec:
      domain:
        features:
          hyperv:
            relaxed: { enabled: true }
            vapic: { enabled: true }
            spinlocks: { enabled: true }
          acpi: {}
        firmware:
          bootloader:
            efi:
              secureBoot: false
        cpu:
          cores: 4
        devices:
          disks:
            - name: bootdisk
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            - name: default
              bridge: {}
        resources:
          requests:
            memory: 4Gi
      networks:
        - name: default
          multus:
            networkName: services-vlan
      volumes:
        - name: bootdisk
          dataVolume:
            name: uboulder-web01-disk-image
        - name: cloudinit
          cloudInitNoCloud:
            userDataSecretRef:
              name: uboulder-01-cloudinit
---
apiVersion: v1
kind: Secret
metadata:
  name: uboulder-01-cloudinit
type: Opaque
data:
  userdata: 
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: uboulder-web01-disk-image
spec:
  source:
    http:
      url: "https://repo.almalinux.org/almalinux/10/cloud/x86_64_v2/images/AlmaLinux-10-GenericCloud-latest.x86_64_v2.qcow2"
  pvc:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 50Gi
