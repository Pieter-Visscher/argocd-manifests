---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: uboulder-01
  labels:
    app: uboulder-01
spec:
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/domain: uboulder-01
    spec:
      domain:
        features:
          hyperv:
            relaxed: { enabled: true }
            vapic: { enabled: true }
            spinlocks: { enabled: true }
          acpi: {}
        firmware:
          bootloader:
            efi:
              secureBoot: false
        cpu:
          cores: 4
        devices:
          disks:
            - name: bootdisk
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            - name: default
              bridge: {}
        resources:
          requests:
            memory: 4Gi
      networks:
        - name: default
          multus:
            networkName: services-vlan
      volumes:
        - name: bootdisk
          dataVolume:
            name: uboulder-web01-disk-image
        - name: cloudinit
          cloudInitNoCloud:
            userData: |
              #cloud-config
              users:
                - name: pieter
                  groups: sudo
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  shell: /bin/bash
                  lock_passwd: false
                  ssh_authorized_keys:
                    - ssh-rsa  pieter@debian
              chpasswd:
                expire: false
                users:
                  - name: pieter
                    password: test123
                    type: text
              ssh_pwauth: true
              write_files:
                - path: /etc/NetworkManager/system-connections/eth0.nmconnection
                  permissions: '0600'
                  content: |
                    [connection]
                    id=eth0
                    type=ethernet
                    interface-name=eth0

                    [ethernet]

                    [ipv4]
                    method=manual
                    addresses=10.0.200.101/24
                    gateway=10.0.200.1
                    dns=10.0.200.1
                    ignore-auto-dns=true

                    [ipv6]
                    method=disabled
              runcmd:
                - nmcli connection reload
                - nmcli connection up eth0
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: uboulder-web01-disk-image
spec:
  source:
    http:
      url: "https://repo.almalinux.org/almalinux/10/cloud/x86_64_v2/images/AlmaLinux-10-GenericCloud-latest.x86_64_v2.qcow2"
  pvc:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 50Gi
