---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: pasworld
  labels:
    app: pasworld
spec:
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/domain: pasworld
    spec:
      domain:
        features:
          hyperv:
            relaxed: { enabled: true }
            vapic: { enabled: true }
            spinlocks: { enabled: true }
          acpi: {}
        firmware:
          bootloader:
            efi:
              secureBoot: false
        cpu:
          cores: 4
        devices:
          disks:
            - name: bootdisk
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            - name: default
              bridge: {}
        resources:
          requests:
            memory: 4Gi
      networks:
        - name: default
          multus:
            networkName: services-vlan
      volumes:
        - name: bootdisk
          dataVolume:
            name: palworld-disk-image
        - name: cloudinit
          cloudInitNoCloud:
            networkData: |
              version: 2
              ethernets:
                enp1s0:
                  addresses:
                    - 10.0.200.102/24
                  gateway4: 10.0.200.1
                  nameservers:
                    addresses:
                      - 10.0.200.1
            userData: |
              #cloud-config
              users:
                - name: palworld
                  groups: sudo
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  shell: /bin/bash
                  lock_passwd: false
                  ssh_authorized_keys:
                    - ssh-rsa  pieter@debian
              chpasswd:
                expire: false
                users:
                  - name: palworld
                    password: c4SeBsMnBm
                    type: text
              ssh_pwauth: true
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: palworld-disk-image
spec:
  source:
    http:
      url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
  pvc:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 50Gi
