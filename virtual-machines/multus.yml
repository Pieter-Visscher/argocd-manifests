---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: services-vlan
spec:
  config: '{
      "cniVersion": "0.3.1",
      "name": "services-vlan",
      "type": "bridge",
      "bridge": "br200",
      "promiscMode": true,
      "ipam": {
        "type": "host-local",
        "ranges": [
          [
            {
              "subnet": "10.0.200.0/24",
              "gateway": "10.0.200.1"
            }
          ]
        ]
      }
    }'
