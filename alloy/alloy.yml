---
apiVersion: v1
kind: ServiceAccount
metadata:
  name:      alloy
  namespace: monitoring
  labels:
    app.kubernetes.io/component: alloy
    app.kubernetes.io/name:      alloy
    app.kubernetes.io/part-of:   kube-prometheus
    app.kubernetes.io/version:   1.8.0
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
  labels:
    app.kubernetes.io/component: alloy
    app.kubernetes.io/name:      alloy
    app.kubernetes.io/part-of:   kube-prometheus
    app.kubernetes.io/version:   1.8.0
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - nodes/metrics
  - services
  - endpoints
  - pods
  - namespaces
  verbs: ["get", "list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
  labels:
    app.kubernetes.io/component: alloy
    app.kubernetes.io/name:      alloy
    app.kubernetes.io/part-of:   kube-prometheus
    app.kubernetes.io/version:   1.8.0
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind:      ClusterRole
  name:      alloy
subjects:
- kind:      ServiceAccount
  name:      alloy
  namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name:      alloy-config
  namespace: monitoring
  labels:
    app.kubernetes.io/component: alloy
    app.kubernetes.io/name:      alloy
    app.kubernetes.io/part-of:   kube-prometheus
    app.kubernetes.io/version:   1.8.0
data:
  config.alloy: |
    // Discover all pods across all namespaces
    discovery.kubernetes "pods" {
      role = "pod"
    }

    // Relabel pod metadata into Loki stream labels and derive log file paths
    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }
      // Drop pods that are not running on this node
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "__host__"
      }
      // Build the log file path from pod UID and container name
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        target_label  = "__path__"
        replacement   = "/var/log/pods/*_*_$1/$2/*.log"
      }
    }

    loki.source.file "pod_logs" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [loki.write.default.receiver]
    }

    // Talos kernel/service logs via syslog UDP
    // Configure Talos: machine.logging.destinations[].endpoint = "udp://alloy.monitoring.svc.cluster.local:514"
    loki.source.syslog "talos" {
      listener {
        address  = "0.0.0.0:514"
        protocol = "udp"
        labels   = { job = "talos" }
      }
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name:      alloy
  namespace: monitoring
  labels:
    app.kubernetes.io/component: alloy
    app.kubernetes.io/name:      alloy
    app.kubernetes.io/part-of:   kube-prometheus
    app.kubernetes.io/version:   1.8.0
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: alloy
      app.kubernetes.io/name:      alloy
      app.kubernetes.io/part-of:   kube-prometheus
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 10%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: alloy
        app.kubernetes.io/name:      alloy
        app.kubernetes.io/part-of:   kube-prometheus
        app.kubernetes.io/version:   1.8.0
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName:  system-cluster-critical
      serviceAccountName: alloy
      tolerations:
      - operator: Exists
      securityContext:
        runAsUser:  0
        runAsGroup: 0
      containers:
      - name:  alloy
        image: docker.io/grafana/alloy:v1.8.0
        args:
        - run
        - /etc/alloy/config.alloy
        - --storage.path=/var/lib/alloy/data
        ports:
        - containerPort: 514
          name:          syslog-udp
          protocol:      UDP
        - containerPort: 12345
          name:          http-metrics
        resources:
          limits:
            cpu:    200m
            memory: 256Mi
          requests:
            cpu:    50m
            memory: 64Mi
        volumeMounts:
        - name:      config
          mountPath: /etc/alloy
          readOnly:  true
        - name:      pod-logs
          mountPath: /var/log/pods
          readOnly:  true
        - name:      wal
          mountPath: /var/lib/alloy/data
      volumes:
      - name: config
        configMap:
          name: alloy-config
      - name: pod-logs
        hostPath:
          path: /var/log/pods
      - name: wal
        hostPath:
          path: /var/lib/alloy
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name:      alloy
  namespace: monitoring
  labels:
    app.kubernetes.io/component: alloy
    app.kubernetes.io/name:      alloy
    app.kubernetes.io/part-of:   kube-prometheus
    app.kubernetes.io/version:   1.8.0
spec:
  ports:
  - name:       syslog-udp
    port:       514
    targetPort: syslog-udp
    protocol:   UDP
  - name:       http-metrics
    port:       12345
    targetPort: http-metrics
  selector:
    app.kubernetes.io/component: alloy
    app.kubernetes.io/name:      alloy
    app.kubernetes.io/part-of:   kube-prometheus
